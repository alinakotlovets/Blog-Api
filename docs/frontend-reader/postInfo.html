<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/style.css">
    <title>Post</title>
</head>
<body>
<div id="edit-modal" class="edit-modal">
    <div class="edit-form">
        <h3>Edit Comment</h3>
        <textarea id="edit-comment-text" class="edit-comment-text"></textarea>
        <div class="edit-comment-btn-box">
            <button class="delete-comment-btn" id="cancel-edit-btn">Cancel</button>
            <button class="edit-comment-btn" id="save-edit-btn">Save</button>
        </div>
        <div id="errors-box"></div>
    </div>
</div>
<nav id="nav-box">
</nav>

<div class="container">
<div class="post-info-box" id="post-info-box">
</div>
<form class="comment-form"  id="comment-form">
    <label for="comment">Comment:</label>
    <textarea class="textarea-comment" id="comment" name="comment"></textarea>
    <button class="green-btn" type="submit">Comment</button>
</form>
<div>
    <ul id="comment-list">
    </ul>
</div>
</div>
</body>
<script type="module" src="js/navbar.js"></script>
<script type="module" src="js/postPage.js"></script>
<script type="module" src="js/editModal.js"></script>
</html>

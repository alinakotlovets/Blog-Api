<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Post</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav>
  <a href="index.html">Home</a>
  <a id="reader-page-link" href="">Reader page</a>
  <a href="add-update-post.html">Add Post</a>
</nav>
<div class="form-box">
<form class="add-update-form" id="add-update-form" enctype="multipart/form-data">
  <label for="title">Title:</label>
  <input type="text" id="title" name="title">
  <label for="content">Content:</label>
  <textarea class="add-update-form-textarea" id="content" name="content"></textarea>
  <label for="previewImage">Preview image:</label>
  <img id="previewImagePreview" src="" alt="Preview" style="display:none; max-width:200px; margin-top:10px;">
  <input type="file" id="previewImage" name="previewImage">
  <div class="is-public-box">
  <label for="isPublic">Is published:</label>
  <input class="is-public-input" type="checkbox" name="isPublic" id="isPublic">
  </div>
  <div class="btn-box">
  <button class="green-btn" type="submit">Submit</button>
  </div>
  <div class="errors-box"></div>
</form>
</div>
</body>
<script type="module">
  import {READER_FRONT} from "./config.js";
  const pageLink = document.getElementById("reader-page-link");
  pageLink.href = `${READER_FRONT}/index.html`;
</script>
<script type="module" src="js/addUpdatePost.js"></script>
</html>
